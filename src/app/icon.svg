<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="100%" height="100%">
  <defs>
    <!-- 왼쪽 원의 그라데이션 색상 정의 -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40D5F7" />
      <stop offset="100%" stop-color="#94E4FA" />
    </linearGradient>
  </defs>

  <!-- 상단 로고 심볼 (두 개의 원) -->
  <g transform="translate(0, -5)">
    <!-- 왼쪽 밝은 파란색(청록색) 원 -->
    <circle cx="140" cy="55" r="35" fill="url(#cyanGradient)" opacity="0.9" />
    <!-- 오른쪽 진한 파란색 원 -->
    <circle cx="180" cy="55" r="42" fill="#00289B" />
  </g>

  <!-- 하단 텍스트 -->
  <!-- 폰트는 기본 산세리프(고딕) 계열을 사용하여 깔끔하게 떨어지도록 설정했습니다. -->
  <text x="160" y="135" text-anchor="middle" font-family="Montserrat, &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif">
    <tspan font-weight="900" fill="#00289B" font-size="52" letter-spacing="-1.5">WON</tspan>
    <tspan font-weight="500" fill="#4567B7" font-size="52" letter-spacing="-0.5">mate</tspan>
  </text>
</svg>